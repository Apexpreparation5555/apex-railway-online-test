<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="APEX PREPRATION ACADEMY पर RRB ALP, RRB NTPC, Railway Group D और RRB Technician के Online Mock Tests और Previous Year Papers का अभ्यास करें।">
  <title>Railway Mock Tests | APEX PREPRATION ACADEMY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172b4d;
    }
    header {
      background: linear-gradient(135deg, #10264b, #245da8);
      color: white;
      text-align: center;
      padding: 28px 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 5px 0; }
    main { max-width: 950px; margin: auto; padding: 20px 14px; }
    .intro {
      background: white; padding: 18px; border-radius: 14px;
      margin-bottom: 18px; text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .card {
      background: white; border-radius: 14px; padding: 20px;
      box-shadow: 0 3px 12px #10264b12;
      border: 1px solid #e1e8f2;
    }
    .card h2 { font-size: 20px; margin-top: 0; }
    .card p { color: #52627a; line-height: 1.5; }
    button, .home {
      display: inline-block; border: 0; border-radius: 8px;
      padding: 11px 14px; background: #245da8; color: white;
      font-weight: bold; text-decoration: none; cursor: pointer;
    }
    .home { background: #e5ad43; color: #10264b; margin-top: 16px; }
    #testList { margin-top: 20px; }
    .test-item {
      background: white; border-radius: 10px; padding: 15px;
      margin: 10px 0; border: 1px solid #e1e8f2;
    }
    footer { text-align: center; padding: 24px 12px; color: #52627a; }
  </style>
</head>
<body>
  <header>
    <h1>🚆 APEX PREPRATION ACADEMY</h1>
    <p><strong>KUMAR ANKUR SIR</strong></p>
    <p>Railway Online Mock Test Portal</p>
  </header>

  <main>
    <section class="intro">
      <h2>📚 Railway Mock Tests</h2>
      <p>अपनी परीक्षा चुनें और अपनी सुविधा के अनुसार टेस्ट का अभ्यास करें।</p>
      <a class="home" href="./index.html">मुख्य वेबसाइट पर जाएँ</a>
    </section>

    <section class="grid" id="examCategories"></section>
    <section id="testList"></section>
  </main>

  <footer>
    © APEX PREPRATION ACADEMY | KUMAR ANKUR SIR
  </footer>

  <script>
    const exams = [
      { id: "RRB ALP", title: "🚆 RRB ALP", desc: "Assistant Loco Pilot Mock Tests" },
      { id: "RRB NTPC", title: "📘 RRB NTPC", desc: "NTPC परीक्षा की तैयारी" },
      { id: "Railway Group D", title: "🎯 Railway Group D", desc: "Group D Mock Tests" },
      { id: "RRB Technician", title: "🛠️ RRB Technician", desc: "Technician परीक्षा की तैयारी" }
    ];

    const categoryArea = document.getElementById("examCategories");
    const testList = document.getElementById("testList");

    exams.forEach(exam => {
      const card = document.createElement("article");
      card.className = "card";

      const heading = document.createElement("h2");
      heading.textContent = exam.title;

      const description = document.createElement("p");
      description.textContent = exam.desc;

      const button = document.createElement("button");
      button.textContent = "टेस्ट देखें";
      button.addEventListener("click", () => showTests(exam.id));

      card.append(heading, description, button);
      categoryArea.appendChild(card);
    });

    function showTests(examId) {
      testList.replaceChildren();

      const heading = document.createElement("h2");
      heading.textContent = examId + " — उपलब्ध टेस्ट";
      testList.appendChild(heading);

      const message = document.createElement("p");
      message.className = "test-item";
      message.textContent =
        "इस कैटेगरी में अभी टेस्ट नहीं जोड़े गए हैं। Admin Panel से टेस्ट जोड़ने की सुविधा अगला स्टेप है।";
      testList.appendChild(message);
    }
  </script>
</body>
</html>
